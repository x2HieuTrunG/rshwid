<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c16">
  <title>HWID Reset — Junkie</title>
  <style>
    :root{color-scheme:dark;--bg:#080c16;--panel:#101a2b;--line:#263750;--muted:#91a1ba;--blue:#3478f6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#1b3155 0,transparent 56%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f7fb}
    .card{width:min(100%,440px);padding:34px;border:1px solid var(--line);border-radius:22px;background:rgba(16,26,43,.97);box-shadow:0 25px 90px #0009}
    .logo{width:54px;height:54px;margin:0 auto 17px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#3478f6,#7855e8);font-size:25px;font-weight:900}
    h1{margin:0;text-align:center;font-size:25px;letter-spacing:2.5px}
    .sub{margin:8px 0 32px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:2px}
    label{display:block;margin-bottom:9px;color:#dbe5f4;font-size:13px;font-weight:650}
    input{width:100%;padding:15px;border:1px solid var(--line);border-radius:10px;background:#080f1d;color:white;font-size:14px;outline:none}
    input:focus{border-color:#5790ff;box-shadow:0 0 0 3px #3478f622}
    button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;letter-spacing:.6px;cursor:pointer;transition:.15s}
    button:hover{background:#2465dc;transform:translateY(-1px)}
    button:disabled{opacity:.6;cursor:wait;transform:none}
    #status{min-height:22px;margin-top:18px;text-align:center;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
    .notice{margin-top:22px;padding:12px;border:1px solid #34445e;border-radius:10px;background:#0b1423;color:#aab9ce;font-size:11px;line-height:1.6}
    .footer{margin-top:25px;text-align:center;color:#687b98;font-size:10px;letter-spacing:1.2px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">J</div>
    <h1>HWID RESET</h1>
    <p class="sub">JUNKIE KEY SYSTEM</p>
    <form id="reset-form">
      <label for="license-key">License Key</label>
      <input id="license-key" name="key" type="text" maxlength="255"
             placeholder="Enter your license key..." autocomplete="off" required>
      <button id="reset-button" type="submit">RESET HWID</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="notice">
      <strong>Note:</strong> Only submit a key you own or are authorized to manage.
      The reset clears the HWID bindings for that key.
    </div>
    <div class="footer">SECURE KEY MANAGEMENT</div>
  </main>
  <script>
    const form = document.getElementById("reset-form");
    const keyInput = document.getElementById("license-key");
    const button = document.getElementById("reset-button");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const key = keyInput.value.trim();
      if (!key) return;

      button.disabled = true;
      button.textContent = "RESETTING...";
      statusBox.textContent = "Contacting Junkie...";
      statusBox.style.color = "#aab9ce";

      try {
        const response = await fetch("/api/reset-hwid", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key })
        });
        const result = await response.json().catch(() => ({}));

        statusBox.textContent = result.message ||
          (response.ok ? "HWID reset successfully." : "Reset failed. Please try again.");
        statusBox.style.color = response.ok && result.success
          ? "#4ade80" : "#fb7185";
      } catch {
        statusBox.textContent = "Could not reach the server. Please try again.";
        statusBox.style.color = "#fb7185";
      } finally {
        button.disabled = false;
        button.textContent = "RESET HWID";
      }
    });
  </script>
</body>
</html>
